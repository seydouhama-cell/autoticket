<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - AutoTicket 🇳🇪</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .logo { text-align: center; font-size: 28px; font-weight: 700; color: #e67e22; margin-bottom: 4px; }
    .logo span { color: #0d1b2a; }
    .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 24px; }
    h2 { font-size: 20px; color: #0d1b2a; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 14px; color: #2c3e50; margin-bottom: 4px; }
    input { width: 100%; padding: 12px 14px; border: 2px solid #e0e4e8; border-radius: 12px; font-size: 14px; transition: 0.3s; }
    input:focus { border-color: #e67e22; outline: none; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn-primary { background: #e67e22; color: white; }
    .btn-primary:hover { background: #d35400; }
    .btn-secondary { background: #2c3e50; color: white; }
    .btn-secondary:hover { background: #1a252f; }
    .footer { text-align: center; margin-top: 16px; font-size: 13px; color: #7f8c8d; }
    .footer a { color: #e67e22; text-decoration: none; font-weight: 600; }
    .alert { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; }
    .alert-success { background: #d5f5e3; color: #1a7a42; border: 1px solid #a9dfbf; }
    .alert-error { background: #fadbd8; color: #922b21; border: 1px solid #f5b7b1; }
  </style>
</head>
<body>

<div class="container">
  <div class="logo">🛜 Auto<span>Ticket</span></div>
  <p class="subtitle">Connectez-vous à votre compte</p>

  <div id="alert"></div>

  <h2>🔐 Connexion</h2>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="login-email" placeholder="exemple@email.com">
  </div>
  <div class="form-group">
    <label>Mot de passe</label>
    <input type="password" id="login-password" placeholder="Votre mot de passe">
  </div>

  <button class="btn btn-primary" id="login-btn">🚀 Se connecter</button>

  <div class="footer">
    Pas encore de compte ? <a href="register.html">S'inscrire</a>
  </div>
</div>

<script>
  const API_URL = 'https://autoticket-backend-ktsj.onrender.com/api';

  function showMessage(msg, type) {
    const alert = document.getElementById('alert');
    alert.className = `alert alert-${type}`;
    alert.textContent = msg;
    setTimeout(() => alert.innerHTML = '', 6000);
  }

  document.getElementById('login-btn').onclick = async function() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    if (!email || !password) {
      showMessage('Veuillez remplir tous les champs.', 'error');
      return;
    }

    try {
      const response = await fetch(API_URL + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem('userId', data.user.id);
        localStorage.setItem('userName', data.user.name);
        localStorage.setItem('userEmail', data.user.email);
        showMessage('✅ Connexion réussie !', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1500);
      } else {
        showMessage(data.message || 'Identifiants incorrects.', 'error');
      }
    } catch (error) {
      showMessage('Erreur de connexion au serveur.', 'error');
    }
  };
</script>

</body>
</html>
